name: Deploy Unified Portal to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify metadata consistency
        run: npm run check:metadata
        
      - name: Assemble Unified Portal
        run: |
          echo "Assembling Unified Portal..."
          mkdir -p public
          cp -R web/* public/

          # Include figures library (chNN/ dirs + manifest + viewer only; exclude dev templates)
          mkdir -p public/figures
          for d in figures/ch*/; do cp -R "$d" public/figures/; done
          cp figures/diagram-library.html figures/diagram-manifest.js figures/diagram-manifest.json public/figures/

          # Duplicate styles so figure HTML relative paths (../web/styles/ and ../../web/styles/) resolve on GH Pages
          mkdir -p public/web
          cp -R web/styles public/web/styles

          if [ -f "release/book.html" ]; then
            cp release/book.html public/book.html
            echo "Copied book.html"
          else
            echo "Warning: release/book.html not found"
          fi

          if [ -f "release/book.pdf" ]; then
            cp release/book.pdf public/book.pdf
            echo "Copied book.pdf"
          else
            echo "Warning: release/book.pdf not found"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
