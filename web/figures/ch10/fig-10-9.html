<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 10.9 — Parallel Run Pattern | Ch.10</title>
  <link rel="stylesheet" href="../../styles/base-style.css">
  <link rel="stylesheet" href="../../styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">

    <div class="d-col" style="align-items:center; gap:6px;">
      <div class="d-box d-legacy" style="min-width:200px; text-align:center; padding:12px;">
        <div class="d-title">Request</div>
      </div>
      <div class="d-arrow-v"></div>
      <div class="d-box d-highlight" style="min-width:280px; text-align:center; padding:12px;">
        <div class="d-title">Parallel Runner</div>
        <div class="d-sub">Gửi request cho cả 2 implementations</div>
      </div>

      <div class="d-row" style="justify-content:center; gap:0;">
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↙</div>
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↘</div>
      </div>

      <div class="d-row" style="gap:20px; align-items:stretch;">
        <div class="d-box d-legacy" style="flex:1; text-align:center; padding:14px;">
          <div class="d-title">Old Logic</div>
          <div class="d-sub">(legacy code)</div>
          <div class="d-zone d-zone-info" style="margin-top:8px; font-size:11px;">Result: dùng cho response</div>
        </div>
        <div class="d-box d-service" style="flex:1; text-align:center; padding:14px;">
          <div class="d-title">New Logic</div>
          <div class="d-sub">(microservice)</div>
          <div class="d-zone d-zone-warning" style="margin-top:8px; font-size:11px;">Result: so sánh, không dùng</div>
        </div>
      </div>

      <div class="d-arrow-v"></div>

      <div class="d-box d-info" style="min-width:280px; text-align:center; padding:12px;">
        <div class="d-title">Compare Results</div>
        <div class="d-sub">Log differences → fix new logic</div>
      </div>
    </div>
  </div>
</body>
</html>
