<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 11.6 — Trace Waterfall — Timing visualization | Ch.11</title>
  <link rel="stylesheet" href="../../companion-web/base-style.css">
  <link rel="stylesheet" href="../../companion-web/diagram-style.css">
  <style>
    .waterfall-bar { height:24px; border-radius:6px; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:600; color:#fff; }
  </style>
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-title-page">Trace Waterfall — Timing visualization</div>

    <!-- Time axis -->
    <div class="d-row" style="margin-bottom:4px;">
      <div style="width:140px;" class="d-label">Service</div>
      <div style="flex:1;" class="d-row">
        <div class="d-sub" style="flex:1; text-align:left;">0ms</div>
        <div class="d-sub" style="flex:1; text-align:center;">200ms</div>
        <div class="d-sub" style="flex:1; text-align:center;">400ms</div>
        <div class="d-sub" style="flex:1; text-align:right;">600ms</div>
      </div>
    </div>
    <div class="d-sep" style="margin-bottom:8px;"></div>

    <!-- Gateway span -->
    <div class="d-row" style="margin-bottom:6px;">
      <div style="width:140px;" class="d-title" style="font-size:12px;">Gateway</div>
      <div style="flex:1; position:relative;">
        <div class="waterfall-bar" style="width:100%; background:#ca8a04;">gateway-filter (580ms)</div>
      </div>
    </div>

    <!-- Core Service span -->
    <div class="d-row" style="margin-bottom:6px;">
      <div style="width:140px;" class="d-title" style="font-size:12px;">Core Service</div>
      <div style="flex:1; position:relative;">
        <div class="waterfall-bar" style="width:70%; margin-left:10%; background:#0f766e;">core-process (350ms)</div>
      </div>
    </div>

    <!-- Judge Service span -->
    <div class="d-row" style="margin-bottom:6px;">
      <div style="width:140px;" class="d-title" style="font-size:12px;">Judge Service</div>
      <div style="flex:1; position:relative;">
        <div class="waterfall-bar" style="width:40%; margin-left:25%; background:#7c3aed;">judge-execute (200ms)</div>
      </div>
    </div>

    <!-- Database span -->
    <div class="d-row" style="margin-bottom:16px;">
      <div style="width:140px;" class="d-title" style="font-size:12px;">Database</div>
      <div style="flex:1; position:relative;">
        <div class="waterfall-bar" style="width:15%; margin-left:30%; background:#2563eb;">query (50ms)</div>
      </div>
    </div>

    <div class="d-box d-note" style="padding:10px 18px;">
      <div class="d-sub" style="text-align:center;">Waterfall view giúp phát hiện bottleneck: service nào chậm nhất? Database query có nhanh không?</div>
    </div>
  </div>
</body>
</html>
