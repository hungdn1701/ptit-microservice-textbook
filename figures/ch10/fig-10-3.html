<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 10.3 — Database: Shared vs Per-Service | Ch.10</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">

    <div class="d-grid-2" style="gap:20px; align-items:start;">
      <!-- Left: Shared DB -->
      <div class="d-cluster" style="padding:16px;">
        <div class="d-label" style="position:static; margin-bottom:10px; text-align:center;">Shared Database ❌</div>
        <div class="d-row" style="gap:10px; justify-content:center; margin-bottom:8px;">
          <div class="d-box d-service" style="flex:1; text-align:center; padding:10px;"><div class="d-title">Core</div></div>
          <div class="d-box d-service" style="flex:1; text-align:center; padding:10px;"><div class="d-title">Assignment</div></div>
        </div>
        <div class="d-row" style="justify-content:center; gap:0; margin-bottom:6px;">
          <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↘</div>
          <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↙</div>
        </div>
        <div class="d-box d-storage" style="text-align:center; padding:12px;">
          <div class="d-title">Shared DB</div>
        </div>
        <div class="d-sep"></div>
        <div class="d-zone d-zone-danger" style="font-size:11px;">Tight coupling · Schema changes affect all</div>
      </div>

      <!-- Right: Per-Service -->
      <div class="d-cluster" style="padding:16px;">
        <div class="d-label" style="position:static; margin-bottom:10px; text-align:center;">Database-per-Service ✅</div>
        <div class="d-row" style="gap:10px; justify-content:center; margin-bottom:8px;">
          <div class="d-box d-service" style="flex:1; text-align:center; padding:10px;"><div class="d-title">Core</div></div>
          <div class="d-box d-service" style="flex:1; text-align:center; padding:10px;"><div class="d-title">Assignment</div></div>
        </div>
        <div class="d-row" style="gap:10px; margin-bottom:6px;">
          <div style="flex:1; text-align:center;" class="d-arrow-v"></div>
          <div style="flex:1; text-align:center;" class="d-arrow-v"></div>
        </div>
        <div class="d-row" style="gap:10px;">
          <div class="d-box d-storage" style="flex:1; text-align:center; padding:12px;"><div class="d-title">Core DB</div></div>
          <div class="d-box d-storage" style="flex:1; text-align:center; padding:12px;"><div class="d-title">Assignment DB</div></div>
        </div>
        <div class="d-sep"></div>
        <div class="d-zone d-zone-success" style="font-size:11px;">Loosely coupled · Independent deployment</div>
      </div>
    </div>
  </div>
</body>
</html>
