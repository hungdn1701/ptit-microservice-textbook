<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 12.1 — Automated Pipeline vs Manual Deployment | Ch.12</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-grid-2" style="gap:20px; align-items:start;">
      <!-- Automated -->
      <div class="d-cluster" style="padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Automated Pipeline</div>
        <div class="d-row" style="gap:6px; align-items:stretch;">
          <div class="d-box d-service" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">Git Push</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-info" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">CI Build</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-event" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">Test</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-success" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">Deploy</div></div>
        </div>
        <div class="d-zone d-zone-success" style="margin-top:8px; font-size:11px;">Repeatable · Fast · Zero human error</div>
      </div>
      <!-- Manual -->
      <div class="d-cluster" style="padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Manual Deployment</div>
        <div class="d-row" style="gap:6px; align-items:stretch;">
          <div class="d-box d-legacy" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">Build locally</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-legacy" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">SCP to server</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-legacy" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">SSH restart</div></div>
          <div class="d-arrow-h" style="align-self:center;"></div>
          <div class="d-box d-danger" style="flex:1; text-align:center; padding:10px;"><div class="d-title" style="font-size:11px;">Manual deploy</div></div>
        </div>
        <div class="d-zone d-zone-danger" style="margin-top:8px; font-size:11px;">Error-prone · Slow · "Works on my machine"</div>
      </div>
    </div>
  </div>
</body>
</html>
