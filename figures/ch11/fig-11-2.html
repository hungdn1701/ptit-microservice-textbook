<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 11.2 — Ba trụ cột Observability | Ch.11</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-row" style="gap:16px; align-items:stretch;">
      <div class="d-box d-info" style="flex:1; padding:16px; text-align:center;">
        <div class="d-title" style="font-size:16px; margin-bottom:8px;">📋 Logs</div>
        <div class="d-sub" style="color:#1e3a8a;">Ghi lại SỰ KIỆN đã xảy ra</div>
        <div class="d-sep"></div>
        <div class="d-stack" style="gap:3px; text-align:left;">
          <div class="d-sub" style="color:#1e3a8a;">• Structured JSON logs</div>
          <div class="d-sub" style="color:#1e3a8a;">• Error stack traces</div>
          <div class="d-sub" style="color:#1e3a8a;">• Audit trail</div>
        </div>
      </div>
      <div class="d-box d-service" style="flex:1; padding:16px; text-align:center;">
        <div class="d-title" style="font-size:16px; margin-bottom:8px;">📊 Metrics</div>
        <div class="d-sub" style="color:#085041;">Đo lường SỐ LIỆU theo thời gian</div>
        <div class="d-sep"></div>
        <div class="d-stack" style="gap:3px; text-align:left;">
          <div class="d-sub" style="color:#085041;">• Latency (p50, p99)</div>
          <div class="d-sub" style="color:#085041;">• Error rate</div>
          <div class="d-sub" style="color:#085041;">• Throughput (RPS)</div>
        </div>
      </div>
      <div class="d-box d-highlight" style="flex:1; padding:16px; text-align:center;">
        <div class="d-title" style="font-size:16px; margin-bottom:8px;">🔗 Traces</div>
        <div class="d-sub" style="color:#3b0764;">Theo dõi HÀNH TRÌNH request</div>
        <div class="d-sep"></div>
        <div class="d-stack" style="gap:3px; text-align:left;">
          <div class="d-sub" style="color:#3b0764;">• Distributed tracing</div>
          <div class="d-sub" style="color:#3b0764;">• Span timing</div>
          <div class="d-sub" style="color:#3b0764;">• Service dependency</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
