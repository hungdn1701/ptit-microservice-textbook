<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 12.5 — Blue-Green Deployment | Ch.12</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-col" style="align-items:center; gap:6px;">
      <div class="d-box d-event" style="min-width:280px; text-align:center; padding:12px;">
        <div class="d-title">Load Balancer</div>
        <div class="d-sub">Switch traffic instantly</div>
      </div>

      <div class="d-row" style="justify-content:center; gap:0;">
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px; color:#2563eb; font-weight:700;">↙ 100%</div>
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px; color:#94a3b8;">↘ 0%</div>
      </div>

      <div class="d-row" style="gap:20px; align-items:stretch;">
        <div class="d-box d-info" style="flex:1; text-align:center; padding:16px;">
          <div class="d-title" style="font-size:16px;">🔵 Blue (v1.0)</div>
          <div class="d-sub" style="color:#1e3a8a;">Currently serving traffic</div>
          <div class="d-sep"></div>
          <div class="d-col" style="gap:4px;">
            <div class="d-box d-info" style="padding:6px; text-align:center;"><div class="d-sub">Instance 1</div></div>
            <div class="d-box d-info" style="padding:6px; text-align:center;"><div class="d-sub">Instance 2</div></div>
          </div>
        </div>
        <div class="d-box d-service" style="flex:1; text-align:center; padding:16px;">
          <div class="d-title" style="font-size:16px;">🟢 Green (v2.0)</div>
          <div class="d-sub" style="color:#085041;">Ready, waiting for switch</div>
          <div class="d-sep"></div>
          <div class="d-col" style="gap:4px;">
            <div class="d-box d-service" style="padding:6px; text-align:center;"><div class="d-sub">Instance 1</div></div>
            <div class="d-box d-service" style="padding:6px; text-align:center;"><div class="d-sub">Instance 2</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-box d-note" style="margin-top:12px; padding:10px 18px;">
      <div class="d-sub" style="text-align:center;">Rollback = chuyển LB quay lại Blue. Instant, zero-downtime.</div>
    </div>
  </div>
</body>
</html>
