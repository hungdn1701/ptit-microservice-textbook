<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 9.2 — Defense in Depth — 4 Layers | Ch.9</title>
  <link rel="stylesheet" href="../../styles/base-style.css">
  <link rel="stylesheet" href="../../styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">

    <div class="d-col" style="gap:10px;">
      <!-- Layer 1 -->
      <div class="d-box d-danger" style="padding:12px 18px;">
        <div class="d-row" style="gap:12px;">
          <div class="d-title" style="min-width:160px;">Layer 1: Network</div>
          <div class="d-sub" style="color:#7f1d1d;">TLS, firewall, VPC isolation</div>
        </div>
      </div>

      <div class="d-arrow-v"></div>

      <!-- Layer 2 -->
      <div class="d-box d-warning" style="padding:12px 18px;">
        <div class="d-row" style="gap:12px;">
          <div class="d-title" style="min-width:160px;">Layer 2: Gateway</div>
          <div class="d-sub" style="color:#7c2d12;">JWT validation, rate limiting, CORS</div>
        </div>
      </div>

      <div class="d-arrow-v"></div>

      <!-- Layer 3 -->
      <div class="d-box d-service" style="padding:12px 18px;">
        <div class="d-row" style="gap:12px;">
          <div class="d-title" style="min-width:160px;">Layer 3: Service</div>
          <div class="d-sub" style="color:#085041;">Authorization, input validation, business rules</div>
        </div>
      </div>

      <div class="d-arrow-v"></div>

      <!-- Layer 4 -->
      <div class="d-box d-storage" style="padding:12px 18px;">
        <div class="d-row" style="gap:12px;">
          <div class="d-title" style="min-width:160px;">Layer 4: Data</div>
          <div class="d-sub" style="color:#1e3a8a;">Encryption at rest, column-level encryption, audit logs</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
