<!DOCTYPE html>

<body class="diagram-mode">

      <div class="d-box d-service text-center" style="width:180px; padding:14px; z-index:2;">
        <div class="d-title">Service</div>
      </div>

      <!-- Branching Arrows -->
      <div style="position: relative; width: 100%; height: 60px; margin: 4px 0;">
        <svg width="100%" height="100%" style="display:block; overflow:visible;">

          <line x1="220" y1="0" x2="334" y2="56" stroke="var(--diagram-color-muted)" stroke-width="2" marker-end="url(#arrow-diag)" />

        <div class="d-arrow-label" style="top: 28px; left: 140px;"><span class="d-step">1</span> INSERT</div>

    </div>
  </div>
