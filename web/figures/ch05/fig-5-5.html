<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Fig 5.5 — Kafka Topic: Partitions and Consumer Group
    =========================================================

  <title>Fig 5.5 — Kafka Topic: Partitions and Consumer Group | Ch.5</title>

<body class="diagram-mode">

  <div class="diagram-canvas" data-fig-id="FIG-5.5" data-ref="CH05-SEC">

    <div class="d-row d-gap-2 d-mb-2" style="align-items: flex-start;">

      <!-- Producer box -->
      <div style="align-self: center;">
        <div class="d-box d-storage text-center" style="width:120px;">
          <div class="d-title">Producer</div>
          <div class="d-sub">Core Service</div>
        </div>
        <div class="d-mt-1 d-text-muted text-center">key: userId</div>
      </div>

      <div class="d-arrow-h" style="align-self: center;"></div>

      <!-- Kafka Cluster -->
      <div class="d-cluster d-mb-2" style="flex:1; position:relative;">
        <div class="d-label">Kafka Cluster</div>

        <!-- Topic -->
        <div class="d-box d-warning d-mt-1">
          <div class="d-title d-mb-1 text-center">Topic: "submissions"</div>
          <!-- Partitions -->
          <div class="d-row" style="align-items: stretch; width: 600px; margin: 0 auto; gap: 24px;">
            <div class="d-box text-center" style="flex: 1; position: relative; z-index: 2;">
              <div class="d-title d-mb-1">Partition 0</div>
              <div class="d-sub d-mb-1">msg1, msg4, msg7…</div>
              <div class="d-label">offset →</div>
            </div>
            <div class="d-box text-center" style="flex: 1; position: relative; z-index: 2;">
              <div class="d-title d-mb-1">Partition 1</div>
              <div class="d-sub d-mb-1">msg2, msg5, msg8…</div>
              <div class="d-label">offset →</div>
            </div>
            <div class="d-box text-center" style="flex: 1; position: relative; z-index: 2;">
              <div class="d-title d-mb-1">Partition 2</div>
              <div class="d-sub d-mb-1">msg3, msg6, msg9…</div>
              <div class="d-label">offset →</div>
            </div>
          </div>
        </div>

      </div>

    </div><!-- /.d-row top -->

    <!-- Spacer with SVG arrows -->
    <div style="height: 40px; position: relative; width: 600px; margin: 0 auto;">
      <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0; overflow: visible; z-index: 10;">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
            <polygon points="0,0 8,0 4,8" fill="var(--diagram-color-muted)" />
          </marker>
        </defs>
        <!-- Lines from bottom of partitions (-22px) to top of consumer boxes (40px + 44px) -->
        <line x1="16.66%" y1="-22" x2="16.66%" y2="82" stroke="var(--diagram-color-muted)" stroke-width="2" marker-end="url(#arrowhead)" />
        <line x1="50%" y1="-22" x2="50%" y2="82" stroke="var(--diagram-color-muted)" stroke-width="2" marker-end="url(#arrowhead)" />
        <line x1="83.33%" y1="-22" x2="83.33%" y2="82" stroke="var(--diagram-color-muted)" stroke-width="2" marker-end="url(#arrowhead)" />
      </svg>
    </div>

    <!-- Consumer Group -->
    <div class="d-cluster" style="width: 600px; margin: 0 auto; position:relative; border-color:var(--diagram-color-success-border); background:var(--diagram-color-success-bg);">
      <div class="d-label d-text-success">Consumer Group: "judge-group"</div>
      <div class="d-row d-mt-1" style="gap: 24px;">
        <div class="d-box d-success text-center" style="flex:1; z-index: 2;">
          <div class="d-title">Consumer 1</div>
          <div class="d-sub">Judge Instance 1</div>
        </div>
        <div class="d-box d-success text-center" style="flex:1; z-index: 2;">
          <div class="d-title">Consumer 2</div>
          <div class="d-sub">Judge Instance 2</div>
        </div>
        <div class="d-box d-success text-center" style="flex:1; z-index: 2;">
          <div class="d-title">Consumer 3</div>
          <div class="d-sub">Judge Instance 3</div>
        </div>
      </div>
    </div>

  </div><!-- /.diagram-canvas -->
