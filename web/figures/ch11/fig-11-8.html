<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 11.8 — User Activity Tracking — Async via Kafka | Ch.11</title>
  <link rel="stylesheet" href="../../styles/base-style.css">
  <link rel="stylesheet" href="../../styles/diagram-style.css">
  <style>
    .seq-line { height:1.5px; background:#64748b; position:relative; flex:1; }
    .seq-line::after { content:'▶'; position:absolute; right:-2px; top:-7px; font-size:10px; color:#64748b; }
    .seq-line.left::after { content:'◀'; left:-2px; right:auto; }
    .seq-line.dashed { background:repeating-linear-gradient(90deg,#94a3b8 0,#94a3b8 4px,transparent 4px,transparent 8px); }
    .seq-label { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:#fff; padding:0 4px; font-size:11px; color:#334155; white-space:nowrap; }
  </style>
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div style="display:flex; gap:0; margin-bottom:12px;">
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-legacy" style="display:inline-block; padding:8px 14px;"><div class="d-title">Student</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-service" style="display:inline-block; padding:8px 14px;"><div class="d-title">Core Service</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-event" style="display:inline-block; padding:8px 14px;"><div class="d-title">Kafka</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-info" style="display:inline-block; padding:8px 14px;"><div class="d-title">Analytics</div></div></div></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:0;">
      <div class="seq-msg"><div style="flex:0.5;"></div><div class="seq-line" style="flex:1;"><span class="seq-label">Submit assignment</span></div><div style="flex:2.5;"></div></div>
      <div class="seq-msg"><div style="flex:1.5;"></div><div class="seq-line" style="flex:1;"><span class="seq-label">Publish: user.activity.submit</span></div><div style="flex:1.5;"></div></div>
      <div class="seq-msg"><div style="flex:0.5;"></div><div class="seq-line dashed left" style="flex:1;"><span class="seq-label">200 OK (async)</span></div><div style="flex:2.5;"></div></div>
      <div style="margin:6px 0; border-top:1px dashed #cbd5e1;"></div>
      <div class="seq-msg"><div style="flex:2.5;"></div><div class="seq-line" style="flex:1;"><span class="seq-label">Consume event</span></div><div style="flex:0.5;"></div></div>
      <div style="display:flex; justify-content:center; margin:4px 0;"><div class="d-zone d-zone-info" style="font-size:11px;">Process → Store analytics</div></div>
    </div>
  </div>
</body>
</html>
