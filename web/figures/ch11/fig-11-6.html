<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 11.6 — Trace Waterfall — Timing visualization | Ch.11</title>
  <link rel="stylesheet" href="../../styles/base-style.css?v=9aa28647">
  <link rel="stylesheet" href="../../styles/diagram-style.css?v=7f87c577">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas" data-fig-id="FIG-11.6">

    <!-- Time axis -->
    <div class="d-row d-mb-1">
      <div style="width:140px;" class="d-label">Service</div>
      <div style="flex:1;" class="d-row">
        <div class="d-sub text-left" style="flex:1;">0ms</div>
        <div class="d-sub text-center" style="flex:1;">200ms</div>
        <div class="d-sub text-center" style="flex:1;">400ms</div>
        <div class="d-sub text-right" style="flex:1;">600ms</div>
      </div>
    </div>
    <div class="d-sep d-mb-1"></div>

    <!-- Gateway span -->
    <div class="d-row d-mb-1">
      <div class="d-title" style="width:140px; font-size:12px;">Gateway</div>
      <div style="flex:1; position:relative;">
        <div class="fw-semibold" style="width:100%; height:24px; border-radius:14px; display:flex; align-items:center; padding:0 12px; background:var(--diagram-color-warning-border); color:#ffffff;">gateway-filter (580ms)</div>
      </div>
    </div>

    <!-- Core Service span -->
    <div class="d-row d-mb-1">
      <div class="d-title" style="width:140px; font-size:12px;">Core Service</div>
      <div style="flex:1; position:relative;">
        <div class="fw-semibold" style="width:70%; margin-left:10%; height:24px; border-radius:14px; display:flex; align-items:center; padding:0 12px; background:var(--diagram-color-success-border); color:#ffffff;">core-process (350ms)</div>
      </div>
    </div>

    <!-- Judge Service span -->
    <div class="d-row d-mb-1">
      <div class="d-title" style="width:140px; font-size:12px;">Judge Service</div>
      <div style="flex:1; position:relative;">
        <div class="fw-semibold" style="width:40%; margin-left:25%; height:24px; border-radius:14px; display:flex; align-items:center; padding:0 12px; background:var(--diagram-color-success-border); color:#ffffff;">judge-execute (200ms)</div>
      </div>
    </div>

    <!-- Database span -->
    <div class="d-row d-mb-2">
      <div class="d-title" style="width:140px; font-size:12px;">Database</div>
      <div style="flex:1; position:relative;">
        <div class="fw-semibold" style="width:15%; margin-left:30%; height:24px; border-radius:14px; display:flex; align-items:center; padding:0 12px; background:var(--diagram-color-info-border); color:#ffffff;">query (50ms)</div>
      </div>
    </div>

    <div class="d-box d-note" style="padding:10px 18px;">
      <div class="d-sub text-center">Waterfall view giúp phát hiện bottleneck: service nào chậm nhất? Database query có nhanh không?</div>
    </div>
  </div>
</body>
</html>
