<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companion Web — SOA & Microservices Textbook</title>
  <link rel="stylesheet" href="styles/base-style.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .app-layout { display: flex; height: 100vh; width: 100vw; }
    
    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    
    /* Sleek Scrollbar for Sidebar */
    .sidebar-content::-webkit-scrollbar { width: 6px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .sidebar-content::-webkit-scrollbar-thumb:hover { background: rgba(255,122,0,0.5); }
    .light .sidebar-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
    .light .sidebar-content::-webkit-scrollbar-thumb:hover { background: rgba(255,122,0,0.5); }

    .sidebar-header {
      padding: 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface); /* sticky header effect */
    }
    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 0;
      color: var(--text-main);
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    /* Portal Links */
    .portal-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .portal-link { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; 
      padding: 14px 10px; border-radius: var(--radius-md); font-size: 11px; font-weight: 600; 
      text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-family: var(--font-sans);
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .portal-link::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .portal-link:hover::after { opacity: 1; }
    .portal-link.primary { background: var(--primary-dim); color: var(--primary); border-color: rgba(255, 122, 0, 0.3); }
    .portal-link.primary:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
    .portal-link.secondary { background: rgba(255,255,255,0.02); color: var(--text-secondary); }
    .portal-link.secondary:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.05); color: var(--text-main); transform: translateY(-2px); }
    
    .portal-link .icon { font-size: 16px; margin-bottom: 2px; line-height: 1; }

    /* Diagram Library Link (full-width portal row) */
    .portal-diagram-link {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px; border-radius: var(--radius-md); font-size: 11px; font-weight: 600;
      text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-family: var(--font-sans);
      border: 1px solid rgba(16, 185, 129, 0.25); color: var(--success);
      background: rgba(16, 185, 129, 0.06);
      position: relative; overflow: hidden;
    }
    .portal-diagram-link::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, rgba(16,185,129,0.08) 0%, transparent 100%);
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .portal-diagram-link:hover::after { opacity: 1; }
    .portal-diagram-link:hover {
      border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.12);
      transform: translateX(3px); box-shadow: 0 0 16px rgba(16,185,129,0.12);
    }
    .portal-diagram-link .link-left { display: flex; align-items: center; gap: 10px; }
    .portal-diagram-link .link-icon { font-size: 15px; line-height: 1; }
    .portal-diagram-link .link-text { display: flex; flex-direction: column; gap: 2px; }
    .portal-diagram-link .link-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .portal-diagram-link .link-sub { font-size: 9px; font-weight: 500; opacity: 0.7; letter-spacing: 0.05em; text-transform: uppercase; font-family: var(--font-mono); }
    .portal-diagram-link .link-arrow { font-size: 10px; opacity: 0.6; transition: transform 0.2s, opacity 0.2s; }
    .portal-diagram-link:hover .link-arrow { transform: translateX(2px); opacity: 1; }

    /* Filter Section */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Filters */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { 
      padding: 6px 14px; font-size: 10px; font-weight: 700; border-radius: 20px; 
      border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text-secondary); 
      cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .filter-btn:hover { border-color: var(--text-main); color: var(--text-main); background: rgba(255,255,255,0.05); }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 2px 10px rgba(255,122,0,0.3); }
    
    /* Pattern List */
    .pattern-list { display: flex; flex-direction: column; gap: 12px; }
    .pattern-item {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      border-radius: var(--radius-md); border: 1px solid var(--border);
      background: var(--bg-card); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none; color: inherit;
      animation: slideIn 0.4s ease forwards;
      opacity: 0;
      transform: translateX(-10px);
      position: relative;
      overflow: hidden;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateX(0); }
    }
    .pattern-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--primary); transform: scaleY(0); transition: transform 0.2s ease-out;
      transform-origin: center;
    }
    .pattern-item:hover { background: var(--bg-card-hover); border-color: var(--border-hover); transform: translateX(4px); box-shadow: var(--shadow-soft); }
    .pattern-item.active { background: var(--primary-dim); border-color: rgba(255,122,0,0.4); }
    .pattern-item.active::before { transform: scaleY(1); }
    
    .pattern-item-icon { 
      width: 36px; height: 36px; border-radius: var(--radius-sm); 
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; font-family: var(--font-mono); 
      color: var(--text-dim); letter-spacing: -0.02em; flex-shrink: 0;
      transition: all 0.3s; 
    }
    .pattern-item.active .pattern-item-icon, .pattern-item:hover .pattern-item-icon { 
      background: var(--primary-dim); border-color: rgba(255,122,0,0.3); 
      color: var(--primary); 
    }

    .pattern-item-info { flex: 1; min-width: 0; }
    .pattern-item-name { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; font-family: var(--font-sans); }
    .pattern-item-ch { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); font-weight: 500; display: inline-block; padding: 2px 6px; background: rgba(255,255,255,0.05); border-radius: 4px; }
    
    /* Main Content (Iframe) */
    .main-content {
      flex: 1;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: inset 20px 0 40px rgba(0,0,0,0.2); /* inner depth */
    }
    iframe#viewer {
      width: 100%; height: 100%; border: none; background: transparent;
      z-index: 2;
    }
    
    /* Welcome Screen - Brutalist Blueprint */
    .welcome-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
      text-align: left; pointer-events: none;
      z-index: 1;
      padding: 80px;
      overflow: hidden;
    }
    .welcome-screen .blueprint-bg {
      position: absolute;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      opacity: 0.03;
      background-image: 
        repeating-linear-gradient(45deg, var(--primary) 0, var(--primary) 1px, transparent 1px, transparent 20px),
        repeating-linear-gradient(-45deg, var(--primary) 0, var(--primary) 1px, transparent 1px, transparent 20px);
      transform: rotate(5deg);
    }
    .welcome-screen h2 { 
      font-size: 48px; color: var(--text-main); margin-bottom: 24px; 
      font-weight: 800; letter-spacing: -0.05em; 
      text-transform: uppercase;
      line-height: 1.1;
      border-left: 8px solid var(--primary);
      padding-left: 24px;
    }
    .welcome-screen p { 
      color: var(--text-secondary); max-width: 500px; 
      line-height: 1.8; font-size: 16px; 
      font-family: var(--font-mono);
      margin-left: 32px;
    }
    .welcome-screen .decoration {
      position: absolute;
      right: 80px; bottom: 80px;
      font-family: var(--font-mono);
      color: var(--primary);
      opacity: 0.5;
      font-size: 12px;
      text-align: right;
    }

    
    @media (max-width: 768px) {
      .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .sidebar { 
        width: 100%; 
        height: auto; 
        border-right: none; 
        border-bottom: 1px solid var(--border); 
        position: relative;
      }
      .sidebar-content {
        display: none; /* Hidden by default on mobile */
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: #ffffff;
        max-height: calc(100vh - 80px);
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        border-bottom: 1px solid #e2e8f0;
        z-index: 100;
      }
      .sidebar-content.open { display: flex; }
      .mobile-menu-btn { display: block !important; }
      .welcome-screen h2 { font-size: 32px; }
      .welcome-screen p { font-size: 14px; margin-left: 0; }
    }

    /* Formal Book Info */
    .book-meta {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .mobile-menu-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; display: none; padding: 4px; line-height: 1; }

    /* Diagram-library inspired master shell */
    html, body {
      background: #ffffff;
      color: #0f172a;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: 100vh;
      width: 100vw;
      background: #ffffff;
    }

    .sidebar {
      width: auto;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.03);
    }

    .sidebar-header {
      padding: 28px 24px 22px;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      background: #ffffff;
    }

    .sidebar-header h1 {
      font-size: 16px;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
    }

    .book-meta {
      color: #64748b;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-top: 6px;
    }

    .header-actions {
      width: 100%;
      justify-content: space-between;
    }

    .theme-toggle,
    .mobile-menu-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #334155;
      padding: 0;
    }

    .theme-toggle:hover,
    .mobile-menu-btn:hover {
      border-color: #0f766e;
      color: #0f766e;
      transform: translateY(-1px);
    }

    .theme-toggle[aria-expanded="true"] {
      background: rgba(15, 118, 110, 0.08);
      border-color: rgba(15, 118, 110, 0.25);
      color: #0f766e;
    }

    .sidebar-content {
      padding: 18px 20px 20px;
      gap: 18px;
      min-height: 0;
      overflow: hidden;
    }

    .portal-links {
      gap: 10px;
      flex: 0 0 auto;
    }

    .portal-link {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      color: #0f172a;
      box-shadow: 0 20px 40px -24px rgba(15, 23, 42, 0.18);
    }

    .portal-link.primary {
      background: rgba(15, 118, 110, 0.06);
      border-color: rgba(15, 118, 110, 0.24);
      color: #0f766e;
    }

    .portal-link.secondary {
      background: #ffffff;
      color: #475569;
    }

    .portal-diagram-link {
      background: rgba(15, 118, 110, 0.06);
      border-color: rgba(15, 118, 110, 0.22);
      color: #0f766e;
      box-shadow: none;
      flex: 0 0 auto;
    }

    .section-label {
      color: #64748b;
    }

    .filter-btn {
      background: #ffffff;
      color: #475569;
      border-color: #e2e8f0;
      box-shadow: none;
    }

    .filter-btn.active {
      background: rgba(15, 118, 110, 0.08);
      color: #0f766e;
      border-color: rgba(15, 118, 110, 0.25);
      box-shadow: none;
    }

    .pattern-list {
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .pattern-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 18px 36px -26px rgba(15, 23, 42, 0.2);
    }

    .pattern-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateX(2px);
      box-shadow: 0 22px 44px -28px rgba(15, 23, 42, 0.22);
    }

    .pattern-item.active {
      background: rgba(15, 118, 110, 0.08);
      border-color: rgba(15, 118, 110, 0.25);
    }

    .pattern-item-icon {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #64748b;
    }

    .main-content {
      background: #f8fafc;
      box-shadow: inset 1px 0 0 #e2e8f0;
      min-height: 0;
    }

    .welcome-screen {
      padding: 80px 72px;
      z-index: 3;
    }

    .welcome-screen .blueprint-bg {
      opacity: 0.025;
    }

    .welcome-screen h2 {
      border-left-color: #0f766e;
      color: #0f172a;
    }

    .welcome-screen p {
      color: #475569;
    }

    .welcome-screen .decoration {
      color: #0f766e;
    }

    .main-content iframe#viewer {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      position: relative;
      z-index: 2;
    }

    .main-content.has-selection iframe#viewer {
      opacity: 1;
      pointer-events: auto;
    }

    .main-content.has-selection .welcome-screen {
      opacity: 0;
    }

    .main-content.has-selection .welcome-screen,
    .main-content.has-selection .welcome-screen * {
      pointer-events: none;
    }

    /* Theme tokens for the master shell */
    :root {
      --shell-bg: #f8fafc;
      --shell-surface: #ffffff;
      --shell-surface-2: #f8fafc;
      --shell-surface-elevated: #eef2f7;
      --shell-card: #ffffff;
      --shell-card-hover: #f8fafc;
      --shell-border: #e2e8f0;
      --shell-border-strong: #cbd5e1;
      --shell-text: #0f172a;
      --shell-muted: #475569;
      --shell-primary: #0f766e;
      --shell-primary-dim: rgba(15, 118, 110, 0.08);
      --shell-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06);
    }

    html:not(.light) {
      --shell-bg: #0b0f14;
      --shell-surface: #11161d;
      --shell-surface-2: #0f141b;
      --shell-surface-elevated: #151c25;
      --shell-card: #11161d;
      --shell-card-hover: #151c25;
      --shell-border: #243041;
      --shell-border-strong: #334155;
      --shell-text: #edf2f7;
      --shell-muted: #94a3b8;
      --shell-primary: #5fd1b0;
      --shell-primary-dim: rgba(95, 209, 176, 0.12);
      --shell-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.28);
    }

    html, body {
      background: var(--shell-bg);
      color: var(--shell-text);
    }

    .app-layout {
      background: var(--shell-bg);
    }

    .sidebar {
      background: var(--shell-surface);
      border-right-color: var(--shell-border);
      box-shadow: var(--shell-shadow);
      min-height: 0;
    }

    .sidebar-header {
      background: var(--shell-surface);
      border-bottom-color: var(--shell-border);
    }

    .sidebar-header h1,
    .welcome-screen h2,
    .pattern-item-name {
      color: var(--shell-text);
    }

    .book-meta,
    .welcome-screen p,
    .section-label,
    .pattern-item-ch {
      color: var(--shell-muted);
    }

    .theme-toggle,
    .mobile-menu-btn,
    .portal-link,
    .filter-btn,
    .pattern-item,
    .pattern-item-icon {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .theme-toggle,
    .mobile-menu-btn {
      background: var(--shell-card);
      border-color: var(--shell-border);
      color: var(--shell-text);
    }

    .sidebar-content {
      background: var(--shell-surface);
    }

    .portal-link {
      background: var(--shell-card);
      border-color: var(--shell-border);
      color: var(--shell-text);
      box-shadow: none;
    }

    .portal-link.primary {
      background: var(--shell-primary-dim);
      border-color: rgba(15, 118, 110, 0.24);
      color: var(--shell-primary);
    }

    .portal-link.secondary {
      background: var(--shell-card);
      color: var(--shell-muted);
    }

    .portal-diagram-link {
      background: var(--shell-primary-dim);
      border-color: rgba(15, 118, 110, 0.25);
      color: var(--shell-primary);
    }

    .filter-btn {
      background: var(--shell-card);
      border-color: var(--shell-border);
      color: var(--shell-muted);
      box-shadow: none;
    }

    .filter-btn.active {
      background: var(--shell-primary-dim);
      border-color: rgba(15, 118, 110, 0.25);
      color: var(--shell-primary);
      box-shadow: none;
    }

    .pattern-item {
      background: var(--shell-card);
      border-color: var(--shell-border);
      box-shadow: 0 18px 36px -26px rgba(15, 23, 42, 0.2);
    }

    .pattern-item:hover {
      background: var(--shell-card-hover);
      border-color: var(--shell-border-strong);
    }

    .pattern-item.active {
      background: var(--shell-primary-dim);
      border-color: rgba(15, 118, 110, 0.24);
    }

    .pattern-item-icon {
      background: var(--shell-surface-elevated);
      border-color: var(--shell-border);
      color: var(--shell-muted);
    }

    .main-content {
      background: var(--shell-bg);
      box-shadow: inset 1px 0 0 var(--shell-border);
      min-height: 0;
    }

    .welcome-screen h2 {
      border-left-color: var(--shell-primary);
    }

    .welcome-screen .decoration {
      color: var(--shell-primary);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>SOA & Microservices</h1>
          <div class="book-meta">Tác giả: Đặng Ngọc Hùng • Phiên bản 1.0.2</div>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light and dark theme">
            <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </button>
          <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="toggleMobileMenu()" title="Menu" aria-label="Toggle navigation panel" aria-expanded="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <div class="portal-links">
          <a href="book.html" class="portal-link primary">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
            Đọc Sách Online
          </a>
          <a href="book.pdf" class="portal-link secondary">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
            Tải Sách (PDF)
          </a>
        </div>
        <a id="diagram-library-link" href="#" class="portal-diagram-link" target="_blank" rel="noopener">
          <span class="link-left">
            <span class="link-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            <span class="link-text">
              <span class="link-title">Thư viện Hình</span>
              <span class="link-sub">Diagram Library · 85 figures</span>
            </span>
          </span>
          <span class="link-arrow">&#8599;</span>
        </a>
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="all">Tất cả</button>
          <button class="filter-btn" data-filter="architecture">Kiến trúc</button>
          <button class="filter-btn" data-filter="api">API & Comm</button>
          <button class="filter-btn" data-filter="data">Data & Sync</button>
          <button class="filter-btn" data-filter="security">Security</button>
          <button class="filter-btn" data-filter="ops">Ops</button>
        </div>
        <div class="pattern-list" id="pattern-list">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
    
    <div class="main-content">
      <div class="welcome-screen" id="welcome-screen">
        <h2>Interactive Pattern Library</h2>
        <p>Chọn một pattern ở thanh bên trái để xem mô phỏng tương tác.</p>
      </div>
      <iframe id="viewer" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const patterns = [
      { ch: 1, icon: 'CH01', name: 'Monolith vs Microservices', desc: 'So sánh visual kiến trúc nguyên khối và microservices', file: 'patterns/architecture/monolith-vs-microservices.html', cat: 'architecture', tags: ['architecture', 'overview'] },
      { ch: 2, icon: 'CH02', name: 'Context Map (DDD)', desc: 'Interactive bounded context map — xác định ranh giới dịch vụ', file: 'patterns/architecture/context-map.html', cat: 'architecture', tags: ['DDD', 'bounded-context'] },
      { ch: 3, icon: 'CH03', name: 'REST API Explorer', desc: 'Send requests, xem response, test các HTTP methods', file: 'patterns/api/rest-api-explorer.html', cat: 'api', tags: ['REST', 'API-design'] },
      { ch: 3, icon: 'CH03', name: 'GraphQL vs REST', desc: 'So sánh N+1 problem và schema-first approach', file: 'patterns/api/graphql-vs-rest.html', cat: 'api', tags: ['GraphQL', 'API-design'] },
      { ch: 4, icon: 'CH04', name: 'Circuit Breaker', desc: 'Ngắt mạch 3 states — Closed → Open → Half-Open', file: 'patterns/security/circuit-breaker.html', cat: 'security', tags: ['resilience', 'fault-tolerance'] },
      { ch: 4, icon: 'CH04', name: 'Service Discovery', desc: 'Eureka register/discover — topology & heartbeat', file: 'patterns/api/service-discovery.html', cat: 'api', tags: ['eureka', 'registry'] },
      { ch: 5, icon: 'CH05', name: 'Message Broker (Kafka)', desc: 'Pub/Sub flow — producer/consumer, partitions, offsets', file: 'patterns/data/message-broker.html', cat: 'data', tags: ['kafka', 'async'] },
      { ch: 6, icon: 'CH06', name: 'Saga Orchestration', desc: 'KBLab Submit Saga — happy path, error, compensation', file: 'patterns/data/saga-orchestration.html', cat: 'data', tags: ['saga', 'transactions'] },
      { ch: 7, icon: 'CH07', name: 'CQRS & Event Sourcing', desc: 'Write/Read model split, event store, replay', file: 'patterns/data/cqrs-event-sourcing.html', cat: 'data', tags: ['CQRS', 'event-sourcing'] },
      { ch: 8, icon: 'CH08', name: 'API Gateway Routing', desc: 'Request pipeline — JWT → CORS → Rate Limit → Route', file: 'patterns/api/api-gateway-routing.html', cat: 'api', tags: ['gateway', 'routing'] },
      { ch: 8, icon: 'CH08', name: 'Rate Limiting', desc: 'Mô phỏng Token Bucket với Redis tại Gateway', file: 'patterns/security/rate-limiting.html', cat: 'security', tags: ['gateway', 'resilience'] },
      { ch: 9, icon: 'CH09', name: 'OAuth2 / JWT Flow', desc: 'Token lifecycle — login, validate, refresh, revoke', file: 'patterns/security/oauth2-jwt-flow.html', cat: 'security', tags: ['security', 'JWT'] },
      { ch: 10, icon: 'CH10', name: 'Strangler Fig Migration', desc: 'Migration slider — 4 phases, traffic split, module decomposition', file: 'patterns/architecture/strangler-fig-migration.html', cat: 'architecture', tags: ['migration', 'strangler-fig'] },
      { ch: 10, icon: 'CH10', name: 'Outbox Pattern', desc: 'Giải quyết Dual-Write Pitfall khi ghi DB và gửi Event', file: 'patterns/data/outbox-pattern.html', cat: 'data', tags: ['data', 'transactions'] },
      { ch: 11, icon: 'CH11', name: 'Distributed Tracing', desc: 'Trace propagation — request flow xuyên multiple services', file: 'patterns/ops/distributed-tracing.html', cat: 'ops', tags: ['tracing', 'observability'] },
      { ch: 12, icon: 'CH12', name: 'Deployment Strategies', desc: 'Blue/Green, Canary, Rolling — visual so sánh', file: 'patterns/ops/deployment-strategies.html', cat: 'ops', tags: ['deployment', 'CI-CD'] },
    ];

    function renderList(filter = 'all') {
      const list = document.getElementById('pattern-list');
      const filtered = filter === 'all' ? patterns : patterns.filter(p => p.cat === filter);
      list.innerHTML = filtered.map((p, index) => `
        <div class="pattern-item" data-file="${p.file}" style="animation-delay: ${index * 0.05}s">
          <div class="pattern-item-icon">${p.icon}</div>
          <div class="pattern-item-info">
            <div class="pattern-item-name">${p.name}</div>
            <div class="pattern-item-ch">Chương ${p.ch}</div>
          </div>
        </div>
      `).join('');
    }

    // Filter buttons
    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderList(e.target.dataset.filter);
    });

    const SUN_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`;
    const MOON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const MENU_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`;
    const CLOSE_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`;
    document.getElementById('theme-toggle-btn').innerHTML = MOON_SVG;

    function syncMobileMenuState() {
      const sidebar = document.getElementById('sidebar-content');
      const button = document.getElementById('mobile-menu-btn');
      if (window.innerWidth <= 768) {
        const isOpen = sidebar.classList.contains('open');
        button.style.display = 'inline-flex';
        button.innerHTML = isOpen ? CLOSE_SVG : MENU_SVG;
        button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      } else {
        button.style.display = 'none';
        sidebar.classList.remove('open');
        button.innerHTML = CLOSE_SVG;
        button.setAttribute('aria-expanded', 'true');
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light');
      const isLight = document.documentElement.classList.contains('light');
      document.getElementById('theme-toggle-btn').innerHTML = isLight ? MOON_SVG : SUN_SVG;
      
      const iframe = document.getElementById('viewer');
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'SET_THEME', isLight }, '*');
      }
    }

    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar-content');
      const button = document.getElementById('mobile-menu-btn');
      const open = sidebar.classList.toggle('open');
      button.setAttribute('aria-expanded', open ? 'true' : 'false');
      button.innerHTML = open ? CLOSE_SVG : MENU_SVG;
    }

    function getDiagramLibraryUrl() {
      const path = window.location.pathname || '';
      const inWebFolder = path.includes('/web/') || path.includes('\\web\\');
      return inWebFolder ? '../figures/diagram-library.html' : 'figures/diagram-library.html';
    }
    
    // Pattern click
    document.getElementById('pattern-list').addEventListener('click', e => {
      const item = e.target.closest('.pattern-item');
      if (!item) return;
      
      document.querySelectorAll('.pattern-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      
      const file = item.dataset.file;
      document.getElementById('viewer').src = file;
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('welcome-screen').style.opacity = '0';
      document.querySelector('.main-content').classList.add('has-selection');
      
      // Auto-close menu on mobile after selection
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar-content').classList.remove('open');
        document.getElementById('mobile-menu-btn').innerHTML = MENU_SVG;
        document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'false');
      }
    });

    window.addEventListener('resize', () => {
      syncMobileMenuState();
    });

    window.addEventListener('message', (e) => {
      if (e.data.type === 'GET_THEME') {
        const isLight = document.documentElement.classList.contains('light');
        const iframe = document.getElementById('viewer');
        if (iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'SET_THEME', isLight }, '*');
        }
      }
    });

    const diagramLibraryLink = document.getElementById('diagram-library-link');
    if (diagramLibraryLink) {
      diagramLibraryLink.href = getDiagramLibraryUrl();
    }

    syncMobileMenuState();
    renderList();
  </script>
</body>
</html>
