<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 9.5b — Token Refresh Flow | Ch.9</title>
  <link rel="stylesheet" href="../../companion-web/base-style.css">
  <link rel="stylesheet" href="../../companion-web/diagram-style.css">
  <style>
    .seq-lane { flex:1; text-align:center; position:relative; }
    .seq-lane::after { content:''; position:absolute; left:50%; top:0; bottom:0; width:1.5px; background:repeating-linear-gradient(180deg,#94a3b8 0,#94a3b8 4px,transparent 4px,transparent 8px); z-index:0; }
    .seq-header { position:relative; z-index:1; }
    .seq-msg { display:flex; align-items:center; min-height:36px; position:relative; z-index:1; }
    .seq-line { height:1.5px; background:#64748b; position:relative; flex:1; }
    .seq-line::after { content:'▶'; position:absolute; right:-2px; top:-7px; font-size:10px; color:#64748b; }
    .seq-line.left::after { content:'◀'; left:-2px; right:auto; }
    .seq-line.dashed { background:repeating-linear-gradient(90deg,#94a3b8 0,#94a3b8 4px,transparent 4px,transparent 8px); }
    .seq-line.danger { background:#dc2626; }
    .seq-line.danger::after { color:#dc2626; }
    .seq-label { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:#fff; padding:0 4px; font-size:11px; color:#334155; white-space:nowrap; }
  </style>
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-title-page">Token Refresh Flow</div>

    <div style="display:flex; gap:0; margin-bottom:12px;">
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-legacy" style="display:inline-block; padding:8px 14px;"><div class="d-title">Client</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-event" style="display:inline-block; padding:8px 14px;"><div class="d-title">Gateway</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-info" style="display:inline-block; padding:8px 14px;"><div class="d-title">Auth Service</div></div></div></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:0;">
      <!-- 1. Expired token request -->
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line" style="flex:2;"><span class="seq-label" style="font-family:var(--diagram-font-mono);">GET /api/data (expired access token)</span></div>
        <div style="flex:1;"></div>
      </div>
      <!-- JWT expired check -->
      <div style="display:flex; justify-content:center; margin:4px 0;">
        <div class="d-zone d-zone-danger" style="font-size:11px;">JWT expired!</div>
      </div>
      <!-- 401 -->
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line dashed danger left" style="flex:2;"><span class="seq-label" style="color:#dc2626;">401 Unauthorized</span></div>
        <div style="flex:1;"></div>
      </div>
      <!-- separator -->
      <div style="margin:8px 0; border-top:1px dashed #cbd5e1;"></div>
      <!-- 2. Refresh request -->
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line" style="flex:4;"><span class="seq-label" style="font-family:var(--diagram-font-mono);">POST /auth/refresh (refresh token)</span></div>
        <div style="flex:1;"></div>
      </div>
      <!-- Validate refresh token -->
      <div style="display:flex; justify-content:center; margin:4px 0;">
        <div class="d-zone d-zone-success" style="font-size:11px;">Validate refresh token → Generate new JWT pair</div>
      </div>
      <!-- New tokens back -->
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line dashed left" style="flex:4;"><span class="seq-label">New access + refresh tokens</span></div>
        <div style="flex:1;"></div>
      </div>
      <!-- separator -->
      <div style="margin:8px 0; border-top:1px dashed #cbd5e1;"></div>
      <!-- 3. Retry with new token -->
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line" style="flex:2;"><span class="seq-label" style="font-family:var(--diagram-font-mono);">GET /api/data (new access token)</span></div>
        <div style="flex:1;"></div>
      </div>
      <div style="display:flex; justify-content:center; margin:4px 0;">
        <div class="d-zone d-zone-success" style="font-size:11px;">✅ Valid</div>
      </div>
      <div class="seq-msg">
        <div style="flex:1;"></div>
        <div class="seq-line dashed left" style="flex:2;"><span class="seq-label">200 OK + data</span></div>
        <div style="flex:1;"></div>
      </div>
    </div>
  </div>
</body>
</html>
