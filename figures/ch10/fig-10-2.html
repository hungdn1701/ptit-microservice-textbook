<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 10.2 — Strangler Fig — Gateway-based Routing | Ch.10</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-title-page">Strangler Fig — Gateway-based Routing</div>

    <div class="d-col" style="align-items:center; gap:6px;">
      <!-- Client -->
      <div class="d-box d-legacy" style="min-width:200px; text-align:center; padding:12px;">
        <div class="d-title">Client</div>
      </div>
      <div class="d-arrow-v"></div>
      <!-- Gateway -->
      <div class="d-box d-event" style="min-width:280px; text-align:center; padding:12px;">
        <div class="d-title">API Gateway</div>
        <div class="d-sub">Route rules quyết định traffic</div>
      </div>

      <!-- Split -->
      <div class="d-row" style="justify-content:center; gap:0;">
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↙</div>
        <div class="d-arrow" style="flex:1; text-align:center; font-size:14px;">↘</div>
      </div>

      <div class="d-row" style="gap:20px; align-items:stretch;">
        <!-- Monolith -->
        <div class="d-box d-legacy" style="flex:1; text-align:center; padding:14px;">
          <div class="d-title">Monolith</div>
          <div class="d-sub">(legacy)</div>
          <div class="d-sep"></div>
          <div class="d-mono" style="font-size:11px;">/api/old/** → monolith</div>
        </div>
        <!-- New Service -->
        <div class="d-box d-service" style="flex:1; text-align:center; padding:14px;">
          <div class="d-title">New Service</div>
          <div class="d-sub">(microservice)</div>
          <div class="d-sep"></div>
          <div class="d-mono" style="font-size:11px;">/api/new/** → new-svc</div>
        </div>
      </div>
    </div>

    <div class="d-box d-note" style="margin-top:16px; padding:10px 18px;">
      <div class="d-sub" style="text-align:center; line-height:1.5;">Gateway dần chuyển route từ Monolith sang New Service. Rollback = đổi config gateway.</div>
    </div>
  </div>
</body>
</html>
