<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 9.4 — JWT Authentication Flow | Ch.9</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
  <style>
    .seq-line { height:1.5px; background:#64748b; position:relative; flex:1; }
    .seq-line::after { content:'▶'; position:absolute; right:-2px; top:-7px; font-size:10px; color:#64748b; }
    .seq-line.left::after { content:'◀'; left:-2px; right:auto; }
    .seq-line.dashed { background:repeating-linear-gradient(90deg,#94a3b8 0,#94a3b8 4px,transparent 4px,transparent 8px); }
    .seq-label { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:#fff; padding:0 4px; font-size:11px; color:#334155; white-space:nowrap; }
  </style>
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">

    <div style="display:flex; gap:0; margin-bottom:12px;">
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-legacy" style="display:inline-block; padding:8px 14px;"><div class="d-title">User</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-event" style="display:inline-block; padding:8px 14px;"><div class="d-title">Gateway</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-info" style="display:inline-block; padding:8px 14px;"><div class="d-title">Auth Service</div></div></div></div>
      <div class="seq-lane"><div class="seq-header"><div class="d-box d-service" style="display:inline-block; padding:8px 14px;"><div class="d-title">Core Service</div></div></div></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:0;">
      <!-- 1. Login -->
      <div class="seq-msg">
        <div style="flex:0.5;"></div>
        <div class="seq-line" style="flex:1;"><span class="seq-label" style="font-family:var(--diagram-font-mono);">POST /login (username, password)</span></div>
        <div style="flex:2.5;"></div>
      </div>
      <!-- 2. Forward -->
      <div class="seq-msg">
        <div style="flex:1.5;"></div>
        <div class="seq-line" style="flex:1;"><span class="seq-label">Forward to auth</span></div>
        <div style="flex:1.5;"></div>
      </div>
      <!-- 3. Validate -->
      <div style="display:flex; justify-content:center; margin:4px 0;">
        <div class="d-zone d-zone-info" style="font-size:11px;">Validate credentials → Generate JWT</div>
      </div>
      <!-- 4. Return JWT -->
      <div class="seq-msg">
        <div style="flex:1.5;"></div>
        <div class="seq-line dashed left" style="flex:1;"><span class="seq-label">JWT token</span></div>
        <div style="flex:1.5;"></div>
      </div>
      <!-- 5. JWT to user -->
      <div class="seq-msg">
        <div style="flex:0.5;"></div>
        <div class="seq-line dashed left" style="flex:1;"><span class="seq-label">200 OK + JWT</span></div>
        <div style="flex:2.5;"></div>
      </div>
      <!-- separator -->
      <div style="margin:8px 0; border-top:1px dashed #cbd5e1;"></div>
      <!-- 6. API call with JWT -->
      <div class="seq-msg">
        <div style="flex:0.5;"></div>
        <div class="seq-line" style="flex:1;"><span class="seq-label" style="font-family:var(--diagram-font-mono);">GET /api/data (Bearer JWT)</span></div>
        <div style="flex:2.5;"></div>
      </div>
      <!-- 7. Verify JWT -->
      <div style="display:flex; justify-content:center; margin:4px 0;">
        <div class="d-zone d-zone-success" style="font-size:11px;">Verify JWT signature</div>
      </div>
      <!-- 8. Forward -->
      <div class="seq-msg">
        <div style="flex:1.5;"></div>
        <div class="seq-line" style="flex:2;"><span class="seq-label">Forward + X-User-Id</span></div>
        <div style="flex:0.5;"></div>
      </div>
      <!-- 9. Response -->
      <div class="seq-msg">
        <div style="flex:1.5;"></div>
        <div class="seq-line dashed left" style="flex:2;"><span class="seq-label">Response</span></div>
        <div style="flex:0.5;"></div>
      </div>
      <!-- 10. To user -->
      <div class="seq-msg">
        <div style="flex:0.5;"></div>
        <div class="seq-line dashed left" style="flex:1;"><span class="seq-label">Response to user</span></div>
        <div style="flex:2.5;"></div>
      </div>
    </div>
  </div>
</body>
</html>
