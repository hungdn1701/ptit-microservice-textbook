name: Deploy Unified Portal to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Assemble Unified Portal
        run: |
          echo "Assembling Unified Portal..."
          mkdir -p public
          cp -R companion-web/* public/

          if [ -f "release/book.html" ]; then
            cp release/book.html public/book.html
            echo "Copied book.html"
          else
            echo "Warning: release/book.html not found"
          fi

          if [ -f "release/book.pdf" ]; then
            cp release/book.pdf public/book.pdf
            echo "Copied book.pdf"
          else
            echo "Warning: release/book.pdf not found"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
