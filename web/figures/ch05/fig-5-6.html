<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Fig 5.6 — Async Submission Flow (Sequence Diagram)
    =========================================================
    Tier 1 HTML migration from fig-5-6.svg
    Layout: Sequence diagram — 6 participants
    Capture: gen-diagrams.ps1 → fig-5-6.png → Typst image()
  -->
  <title>Fig 5.6 — Async Submission Flow | Ch.5</title>
  <link rel="stylesheet" href="../../styles/base-style.css?v=cec58d45">
  <link rel="stylesheet" href="../../styles/diagram-style.css?v=7f87c577">

</head>
<body class="diagram-mode">

  <div class="diagram-canvas" style="min-height: 620px;" data-ref="CH05-SEC">

    <!--
      Participants (N=6, flex:1 each):
        0: Student  1: Frontend  2: Core Service  3: Kafka  4: Judge Service  5: WebSocket
      Forward  (a→b, a<b): left = a+0.5, line = b-a, right = N-b-0.5
      Backward (b→a, b>a): left = a+0.5, line = b-a, right = N-b-0.5  + class "reverse"
    -->
    <div class="d-seq-container">

      <!-- Participants row -->
      <div class="d-seq-participants">
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-legacy">Student</div>
        </div>
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-note">Frontend</div>
        </div>
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-service">Core Service</div>
        </div>
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-event">Kafka</div>
        </div>
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-service">Judge Service</div>
        </div>
        <div class="d-seq-actor">
          <div class="d-seq-actor-box d-highlight">WebSocket</div>
        </div>
      </div>

      <div class="d-seq-messages">

        <!-- 1. Student(0) → Frontend(1): Submit SQL  [left=0.5, line=1, right=4.5] -->
        <div class="d-seq-msg">
          <div style="flex:0.5"></div>
          <div class="d-seq-msg-line" style="flex:1">
            <span class="d-seq-msg-text">Submit SQL</span>
          </div>
          <div style="flex:4.5"></div>
        </div>

        <!-- 2. Frontend(1) → Core Service(2): POST /submit  [left=1.5, line=1, right=3.5] -->
        <div class="d-seq-msg">
          <div style="flex:1.5"></div>
          <div class="d-seq-msg-line" style="flex:1">
            <span class="d-seq-msg-text">POST /submit</span>
          </div>
          <div style="flex:3.5"></div>
        </div>

        <!-- 3. Core(2) → Kafka(3): Publish SubmitMessage  [left=2.5, line=1, right=2.5] -->
        <div class="d-seq-msg">
          <div style="flex:2.5"></div>
          <div class="d-seq-msg-line" style="flex:1">
            <span class="d-seq-msg-text">Publish SubmitMessage</span>
          </div>
          <div style="flex:2.5"></div>
        </div>

        <!-- 4. Core(2) → Frontend(1): 202 Accepted  [backward, dashed; left=1.5, line=1, right=3.5] -->
        <div class="d-seq-msg">
          <div style="flex:1.5"></div>
          <div class="d-seq-msg-line dashed reverse" style="flex:1">
            <span class="d-seq-msg-text d-text-success fw-semibold">
              202 Accepted (no wait for result)
            </span>
          </div>
          <div style="flex:3.5"></div>
        </div>

        <!-- Spacer row + non-blocking annotation -->
        <div class="d-seq-msg d-center" style="min-height:24px; ">
          <div style="flex:1.5"></div>
          <div style="flex:1; display:flex; justify-content:center; align-items:center;">
            <span class="d-zone-success fw-semibold" style="border-radius: 6px; padding: 4px 10px; white-space: nowrap;"> Non-blocking — A continues immediately</span>
          </div>
          <div style="flex:3.5"></div>
        </div>

        <!-- 5. Kafka(3) → Judge(4): Consume message  [left=3.5, line=1, right=1.5] -->
        <div class="d-seq-msg">
          <div style="flex:3.5"></div>
          <div class="d-seq-msg-line" style="flex:1">
            <span class="d-seq-msg-text">Consume message</span>
          </div>
          <div style="flex:1.5"></div>
        </div>

        <!-- 6. Note at Judge(4): Execute SQL on sandbox  [col=4, N=6] -->
        <div class="d-seq-msg" style="min-height:28px;">
          <div style="flex:4"></div>
          <div class="d-zone d-zone-warning text-center" style="flex:1; padding:3px 6px; white-space:nowrap;">
            Execute SQL on sandbox
          </div>
          <div style="flex:1"></div>
        </div>

        <!-- 7. Judge(4) → Kafka(3): Publish ResultMessage  [backward; left=3.5, line=1, right=1.5] -->
        <div class="d-seq-msg">
          <div style="flex:3.5"></div>
          <div class="d-seq-msg-line reverse" style="flex:1">
            <span class="d-seq-msg-text">Publish ResultMessage</span>
          </div>
          <div style="flex:1.5"></div>
        </div>

        <!-- 8. Kafka(3) → Core(2): Consume result  [backward; left=2.5, line=1, right=2.5] -->
        <div class="d-seq-msg">
          <div style="flex:2.5"></div>
          <div class="d-seq-msg-line reverse" style="flex:1">
            <span class="d-seq-msg-text">Consume result</span>
          </div>
          <div style="flex:2.5"></div>
        </div>

        <!-- 9. Core(2) → WebSocket(5): Push via WebSocket  [left=2.5, line=3, right=0.5] -->
        <div class="d-seq-msg">
          <div style="flex:2.5"></div>
          <div class="d-seq-msg-line" style="flex:3">
            <span class="d-seq-msg-text">Push via WebSocket</span>
          </div>
          <div style="flex:0.5"></div>
        </div>

        <!-- 10. WebSocket(5) → Frontend(1): Update UI  [backward; left=1.5, line=4, right=0.5] -->
        <div class="d-seq-msg">
          <div style="flex:1.5"></div>
          <div class="d-seq-msg-line reverse" style="flex:4">
            <span class="d-seq-msg-text">Update UI</span>
          </div>
          <div style="flex:0.5"></div>
        </div>

        <!-- 11. Frontend(1) → Student(0): Display results  [backward, dashed; left=0.5, line=1, right=4.5] -->
        <div class="d-seq-msg">
          <div style="flex:0.5"></div>
          <div class="d-seq-msg-line dashed reverse" style="flex:1">
            <span class="d-seq-msg-text">Display results</span>
          </div>
          <div style="flex:4.5"></div>
        </div>

        <div style="height:8px;"></div>

      </div><!-- /.d-seq-messages -->

    </div><!-- /.d-seq-container -->

  </div><!-- /.diagram-canvas -->

</body>
</html>
