<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 12.6 — Kubernetes Architecture | Ch.12</title>
  <link rel="stylesheet" href="../../companion-web/base-style.css">
  <link rel="stylesheet" href="../../companion-web/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-title-page">Kubernetes Architecture</div>
    <div class="d-grid-2" style="gap:16px; align-items:start;">
      <!-- Control Plane -->
      <div class="d-cluster" style="padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Control Plane (Master)</div>
        <div class="d-col" style="gap:6px;">
          <div class="d-box d-highlight" style="text-align:center; padding:10px;">
            <div class="d-title">API Server</div>
            <div class="d-sub">REST API entry point</div>
          </div>
          <div class="d-row" style="gap:6px;">
            <div class="d-box d-storage" style="flex:1; text-align:center; padding:10px;">
              <div class="d-title" style="font-size:11px;">etcd</div>
              <div class="d-sub">Config store</div>
            </div>
            <div class="d-box d-event" style="flex:1; text-align:center; padding:10px;">
              <div class="d-title" style="font-size:11px;">Scheduler</div>
              <div class="d-sub">Pod placement</div>
            </div>
          </div>
          <div class="d-box d-info" style="text-align:center; padding:10px;">
            <div class="d-title">Controller Manager</div>
            <div class="d-sub">Desired state → actual state</div>
          </div>
        </div>
      </div>

      <!-- Worker Nodes -->
      <div class="d-cluster" style="padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Worker Nodes</div>
        <div class="d-col" style="gap:6px;">
          <div class="d-box d-service" style="padding:10px;">
            <div class="d-title" style="text-align:center; margin-bottom:4px;">Node 1</div>
            <div class="d-row" style="gap:4px;">
              <div class="d-box d-service" style="flex:1; text-align:center; padding:6px;"><div class="d-sub">Pod A</div></div>
              <div class="d-box d-service" style="flex:1; text-align:center; padding:6px;"><div class="d-sub">Pod B</div></div>
            </div>
          </div>
          <div class="d-box d-service" style="padding:10px;">
            <div class="d-title" style="text-align:center; margin-bottom:4px;">Node 2</div>
            <div class="d-row" style="gap:4px;">
              <div class="d-box d-service" style="flex:1; text-align:center; padding:6px;"><div class="d-sub">Pod C</div></div>
              <div class="d-box d-service" style="flex:1; text-align:center; padding:6px;"><div class="d-sub">Pod D</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
