<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 12.7 — Service Mesh — Sidecar Proxy | Ch.12</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">
    <div class="d-title-page">Service Mesh — Sidecar Proxy</div>
    <div class="d-row" style="gap:16px; align-items:stretch;">
      <!-- Service A with sidecar -->
      <div class="d-cluster" style="flex:1; padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Service Instance A</div>
        <div class="d-row" style="gap:8px;">
          <div class="d-box d-service" style="flex:1; text-align:center; padding:12px;">
            <div class="d-title">Core Service</div>
            <div class="d-sub">Business logic</div>
          </div>
          <div class="d-box d-highlight" style="flex:1; text-align:center; padding:12px;">
            <div class="d-title">Envoy Proxy</div>
            <div class="d-sub">Sidecar</div>
          </div>
        </div>
      </div>

      <!-- Connection between proxies -->
      <div class="d-col" style="justify-content:center; gap:4px;">
        <div class="d-arrow-h"></div>
        <div class="d-sub" style="text-align:center; font-size:10px; white-space:nowrap;">mTLS encrypted</div>
      </div>

      <!-- Service B with sidecar -->
      <div class="d-cluster" style="flex:1; padding:14px;">
        <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Service Instance B</div>
        <div class="d-row" style="gap:8px;">
          <div class="d-box d-highlight" style="flex:1; text-align:center; padding:12px;">
            <div class="d-title">Envoy Proxy</div>
            <div class="d-sub">Sidecar</div>
          </div>
          <div class="d-box d-service" style="flex:1; text-align:center; padding:12px;">
            <div class="d-title">Judge Service</div>
            <div class="d-sub">Business logic</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Control plane -->
    <div class="d-arrow-v" style="margin:8px auto;"></div>
    <div class="d-box d-event" style="text-align:center; padding:12px 24px;">
      <div class="d-title">Control Plane (Istio / Linkerd)</div>
      <div class="d-sub">Config, telemetry, certificates</div>
    </div>
  </div>
</body>
</html>
