<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fig 9.7 — KBLab LMS — Kiến trúc bảo mật tổng quan | Ch.9</title>
  <link rel="stylesheet" href="../../web/styles/base-style.css">
  <link rel="stylesheet" href="../../web/styles/diagram-style.css">
</head>
<body class="diagram-mode">
  <div class="diagram-canvas">

    <!-- Internet layer -->
    <div class="d-cluster" style="padding:14px 18px; margin-bottom:8px;">
      <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Internet</div>
      <div class="d-row" style="justify-content:center; gap:16px;">
        <div class="d-box d-note" style="flex:1; max-width:180px; text-align:center; padding:10px;">
          <div class="d-title">Student App</div>
        </div>
        <div class="d-box d-note" style="flex:1; max-width:180px; text-align:center; padding:10px;">
          <div class="d-title">Admin CMS</div>
        </div>
      </div>
    </div>

    <div class="d-arrow-v"></div>

    <!-- Edge layer -->
    <div class="d-cluster" style="padding:14px 18px; margin-bottom:8px;">
      <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Edge Layer</div>
      <div class="d-row" style="justify-content:center;">
        <div class="d-box d-event" style="text-align:center; padding:12px 20px;">
          <div class="d-title">Gateway :9001</div>
          <div class="d-sub">JWT validation · CORS · Rate limiting</div>
        </div>
      </div>
    </div>

    <div class="d-arrow-v"></div>

    <!-- Service layer -->
    <div class="d-cluster" style="padding:14px 18px;">
      <div class="d-label" style="position:static; margin-bottom:8px; text-align:center;">Service Layer (Internal Network)</div>
      <div class="d-row" style="gap:8px; flex-wrap:wrap; justify-content:center;">
        <div class="d-box d-info" style="flex:1; min-width:130px; max-width:160px; text-align:center; padding:10px 6px;">
          <div class="d-title" style="font-size:12px;">Auth Service</div>
          <div class="d-sub">JWT issuer, RBAC</div>
        </div>
        <div class="d-box d-service" style="flex:1; min-width:130px; max-width:160px; text-align:center; padding:10px 6px;">
          <div class="d-title" style="font-size:12px;">Core Service</div>
          <div class="d-sub">@PreAuthorize</div>
        </div>
        <div class="d-box d-service" style="flex:1; min-width:130px; max-width:160px; text-align:center; padding:10px 6px;">
          <div class="d-title" style="font-size:12px;">Assignment</div>
          <div class="d-sub">@PreAuthorize</div>
        </div>
        <div class="d-box d-service" style="flex:1; min-width:130px; max-width:160px; text-align:center; padding:10px 6px;">
          <div class="d-title" style="font-size:12px;">Judge Service</div>
          <div class="d-sub">internal only</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
