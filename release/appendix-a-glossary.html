<h1>Phụ lục A: Bảng thuật ngữ</h1><p>Thuật ngữ kỹ thuật sử dụng trong sách, sắp xếp theo bảng chữ cái. Phụ lục này đồng bộ với bảng thuật ngữ chuẩn của sách.</p><figure><table><thead><tr><th>English</th><th>Giải thích ngắn</th><th>Chương đầu</th></tr></thead><tbody><tr><td>Aggregate</td><td>Cụm entity/value object được xem như một đơn vị nhất quán, truy cập qua một “gốc” (aggregate root) để bảo vệ ràng buộc nghiệp vụ.</td><td>Ch.2</td></tr><tr><td>Anti-Corruption Layer</td><td>ACL — lớp dịch trung gian giúp một service không bị “nhiễm” mô hình dữ liệu của hệ thống ngoài/legacy khi tích hợp.</td><td>Ch.10</td></tr><tr><td>API Composition</td><td>Gộp dữ liệu từ nhiều service bằng cách gọi lần lượt rồi ghép kết quả ở tầng gọi (thay cho join trong database).</td><td>Ch.7</td></tr><tr><td>API Gateway</td><td>Cổng vào duy nhất cho client, đảm nhận các việc chung (routing, auth, rate limit) thay cho từng service.</td><td>Ch.8</td></tr><tr><td>Backend for Frontend</td><td>BFF — một gateway riêng “may đo” cho từng loại client (web, mobile), trả về dữ liệu vừa vặn nhu cầu client đó.</td><td>Ch.8</td></tr><tr><td>Blue/Green Deployment</td><td>Chạy song song hai môi trường (cũ “blue” và mới “green”), chuyển toàn bộ traffic sang bản mới khi sẵn sàng, rollback tức thì nếu lỗi.</td><td>Ch.12</td></tr><tr><td>Bottleneck</td><td>Điểm nghẽn — thành phần chậm nhất giới hạn hiệu năng của toàn hệ thống.</td><td>Ch.1</td></tr><tr><td>Bounded Context</td><td>Phạm vi mà một mô hình domain (cùng bộ thuật ngữ, quy tắc) có hiệu lực; ranh giới tự nhiên để chia service. Ẩn dụ: một “Khoa” trong trường có ngôn ngữ và quy định riêng.</td><td>Ch.2</td></tr><tr><td>Build</td><td>Biên dịch mã nguồn và đóng gói thành artifact chạy được.</td><td>Ch.12</td></tr><tr><td>Business Logic</td><td>Phần mã nguồn cốt lõi thực thi các quy tắc, tính toán và luồng nghiệp vụ đặc thù của miền.</td><td>Ch.1</td></tr><tr><td>Bulkhead</td><td>Cô lập tài nguyên (thread pool, connection) theo nhóm để một phần quá tải không gây đình trệ phần còn lại. Ẩn dụ: khoang kín của tàu thủy.</td><td>Ch.4</td></tr><tr><td>Canary Deployment</td><td>Phát hành dần cho một nhóm nhỏ người dùng trước, theo dõi, rồi mới mở rộng toàn bộ.</td><td>Ch.12</td></tr><tr><td>Change Data Capture</td><td>CDC — bắt các thay đổi trong database (insert/update/delete) thành luồng sự kiện cho hệ thống khác tiêu thụ.</td><td>Ch.7</td></tr><tr><td>Chaos Engineering</td><td>Chủ động gây lỗi có kiểm soát trên hệ thống thật để kiểm chứng khả năng chịu lỗi.</td><td>Ch.11</td></tr><tr><td>Circuit Breaker</td><td>“Ngắt mạch” tạm dừng gọi tới một service đang lỗi để tránh lỗi lan và cho nó thời gian hồi phục. Ẩn dụ: cầu dao điện.</td><td>Ch.4</td></tr><tr><td>Choreography</td><td>Cách phối hợp saga không có “nhạc trưởng”: mỗi service tự phản ứng với event và phát event tiếp theo.</td><td>Ch.6</td></tr><tr><td>CI/CD</td><td>Continuous Integration / Continuous Delivery — tự động build, test, triển khai mỗi khi mã nguồn thay đổi.</td><td>Ch.12</td></tr><tr><td>Cluster</td><td>Nhóm nhiều máy/node hoạt động như một hệ thống thống nhất.</td><td>Ch.12</td></tr><tr><td>Compensating Transaction</td><td>Giao dịch bù trừ — thao tác “làm ngược lại” để hoàn tác hệ quả của một bước đã thực hiện trong saga (vì không thể rollback như transaction database).</td><td>Ch.6</td></tr><tr><td>Container</td><td>Gói đóng kín ứng dụng cùng mọi phụ thuộc để chạy giống nhau ở mọi môi trường.</td><td>Ch.12</td></tr><tr><td>Conway’s Law</td><td>Cấu trúc hệ thống có xu hướng phản chiếu cấu trúc giao tiếp của tổ chức tạo ra nó.</td><td>Ch.2</td></tr><tr><td>Consumer-Driven Contract</td><td>CDC — consumer định nghĩa “hợp đồng” (kỳ vọng về request/response), provider xác minh hợp đồng đó trong CI trước khi deploy (công cụ: Pact).</td><td>Ch.3</td></tr><tr><td>Contract Testing</td><td>Kiểm thử xác nhận hai service tuân thủ đúng “hợp đồng” API đã thỏa thuận, không cần chạy cả hai cùng lúc.</td><td>Ch.3</td></tr><tr><td>Correlation ID</td><td>Mã định danh gắn theo một request xuyên suốt nhiều service, giúp truy vết một luồng xử lý trong log/trace.</td><td>Ch.8</td></tr><tr><td>CQRS</td><td>Command Query Responsibility Segregation — tách mô hình ghi (command) và mô hình đọc (query) thành hai đường riêng để tối ưu độc lập.</td><td>Ch.7</td></tr><tr><td>Cross-cutting concerns</td><td>Các nghiệp vụ cắt ngang toàn bộ hệ thống (như bảo mật, logging, rate limiting) không thuộc về một domain cụ thể nào.</td><td>Ch.8</td></tr><tr><td>DB Queue</td><td>Dùng một bảng database làm hàng đợi công việc — đơn giản hơn message broker cho nhu cầu nhỏ.</td><td>Ch.5</td></tr><tr><td>Dead Letter Topic/Queue</td><td>DLT — nơi chứa message xử lý thất bại sau nhiều lần thử, để xử lý riêng thay vì retry vô hạn.</td><td>Ch.5</td></tr><tr><td>Debug</td><td>Tìm và sửa nguyên nhân lỗi trong phần mềm.</td><td>Ch.1</td></tr><tr><td>Distributed Monolith</td><td>Phản-pattern: hệ “microservices” nhưng các service ràng buộc chặt, phải deploy cùng nhau — gánh nhược điểm của cả hai mô hình.</td><td>Ch.1</td></tr><tr><td>Docker Compose</td><td>Công cụ định nghĩa và chạy nhiều container cùng lúc bằng một file YAML.</td><td>Ch.12</td></tr><tr><td>Domain-Driven Design</td><td>DDD — phương pháp thiết kế lấy mô hình nghiệp vụ (domain) làm trung tâm, dùng ngôn ngữ chung giữa lập trình viên (developer) và chuyên gia nghiệp vụ.</td><td>Ch.2</td></tr><tr><td>Downtime</td><td>Khoảng thời gian hệ thống không phục vụ được.</td><td>Ch.4</td></tr><tr><td>DTO</td><td>Data Transfer Object — đối tượng chỉ để truyền dữ liệu qua ranh giới (API), tách biệt với entity nội bộ.</td><td>Ch.3</td></tr><tr><td>Effectively-once</td><td>Đảm bảo “như thể xử lý đúng một lần” bằng at-least-once + idempotency (vì exactly-once tuyệt đối xuyên hệ là bất khả thi).</td><td>Ch.5</td></tr><tr><td>Endpoint</td><td>Điểm cuối giao tiếp mạng (thường là một URL cụ thể) nơi API tiếp nhận và trả về dữ liệu cho client.</td><td>Ch.3</td></tr><tr><td>Event Sourcing</td><td>Lưu trạng thái dưới dạng chuỗi sự kiện bất biến (thay vì chỉ trạng thái hiện tại); trạng thái được tái dựng bằng cách “phát lại” sự kiện. Ẩn dụ: sổ sao kê ngân hàng.</td><td>Ch.7</td></tr><tr><td>Event Storming</td><td>Workshop dùng sticky note để cùng khám phá domain qua các sự kiện nghiệp vụ.</td><td>Ch.2</td></tr><tr><td>Event-driven</td><td>Hướng sự kiện — kiến trúc trong đó các service giao tiếp gián tiếp bằng cách phát và nghe sự kiện.</td><td>Ch.5</td></tr><tr><td>Eventual Consistency</td><td>Dữ liệu giữa các service cuối cùng sẽ đồng bộ, nhưng có một khoảng trễ ngắn được chấp nhận (đối lập với strong consistency).</td><td>Ch.6</td></tr><tr><td>Flyway / Liquibase</td><td>Công cụ quản lý phiên bản schema database (versioned migrations), chạy như một bước riêng trước khi deploy service.</td><td>Ch.12</td></tr><tr><td>GitOps</td><td>Quản lý hạ tầng/triển khai bằng Git làm nguồn sự thật duy nhất; mọi thay đổi qua commit/PR.</td><td>Ch.12</td></tr><tr><td>GraphQL</td><td>Ngôn ngữ truy vấn API cho phép client yêu cầu đúng dữ liệu cần, tránh over/under-fetching.</td><td>Ch.3</td></tr><tr><td>gRPC</td><td>Framework RPC hiệu năng cao của Google chạy trên HTTP/2 + Protobuf, hợp cho giao tiếp nội bộ service-to-service.</td><td>Ch.4</td></tr><tr><td>HATEOAS</td><td>Mức “trưởng thành” của REST trong đó response kèm các link điều hướng hành động tiếp theo.</td><td>Ch.3</td></tr><tr><td>Hexagonal Architecture</td><td>Ports &amp; Adapters — tách lõi nghiệp vụ khỏi hạ tầng qua “cổng” và “bộ chuyển đổi”, giúp dễ test và thay công nghệ.</td><td>Ch.3</td></tr><tr><td>Header</td><td>Tiêu đề của một gói tin hoặc yêu cầu HTTP, dùng để truyền tải các siêu dữ liệu (metadata) như token xác thực.</td><td>Ch.8</td></tr><tr><td>Idempotency (tính lũy đẳng)</td><td>Tính chất của một thao tác: thực hiện nhiều lần cho kết quả giống như thực hiện một lần duy nhất. Ẩn dụ: bấm nút gọi thang máy 5 lần, thang vẫn chỉ đến một lần.</td><td>Ch.4</td></tr><tr><td>Infrastructure as Code</td><td>IaC — mô tả hạ tầng bằng mã/khai báo để tạo lại tự động và nhất quán.</td><td>Ch.12</td></tr><tr><td>JWT</td><td>JSON Web Token — token tự chứa thông tin định danh, có chữ ký để verify mà không cần tra database. Ẩn dụ: thẻ sinh viên có đóng dấu mộc đỏ của nhà trường.</td><td>Ch.9</td></tr><tr><td>k3s</td><td>Bản Kubernetes gọn nhẹ, hợp cho edge và môi trường tài nguyên thấp.</td><td>Ch.12</td></tr><tr><td>Load Balancing</td><td>Phân phối request đến nhiều instance để tránh quá tải một instance.</td><td>Ch.4</td></tr><tr><td>Message broker</td><td>Trung gian nhận/lưu/chuyển message giữa producer và consumer, cho phép giao tiếp bất đồng bộ. Ẩn dụ: bưu điện giữ thư hộ.</td><td>Ch.5</td></tr><tr><td>Microservice</td><td>Dịch vụ nhỏ, tự chủ, triển khai độc lập, sở hữu dữ liệu riêng và giao tiếp với nhau qua mạng.</td><td>Ch.1</td></tr><tr><td>Modular Monolith</td><td>Ứng dụng đơn khối nhưng chia module ranh giới rõ ràng bên trong — một lựa chọn hợp lệ trước khi tách microservices.</td><td>Ch.1</td></tr><tr><td>Monolith</td><td>Kiến trúc nguyên khối: ứng dụng được đóng gói và triển khai như một khối duy nhất.</td><td>Ch.1</td></tr><tr><td>mTLS</td><td>Mutual TLS — hai phía cùng xác thực nhau bằng chứng chỉ TLS, đảm bảo cả hai đầu đều tin cậy.</td><td>Ch.9</td></tr><tr><td>OAuth2</td><td>Chuẩn ủy quyền cho phép cấp quyền truy cập tài nguyên mà không chia sẻ mật khẩu.</td><td>Ch.9</td></tr><tr><td>Observability</td><td>Khả năng hiểu trạng thái bên trong hệ thống từ dữ liệu nó phát ra (logs, metrics, traces) — đủ để đặt câu hỏi mới mà không cần triển khai (deploy) lại.</td><td>Ch.11</td></tr><tr><td>OIDC</td><td>OpenID Connect — lớp xác thực (authentication) xây trên OAuth2, bổ sung danh tính người dùng qua ID token.</td><td>Ch.9</td></tr><tr><td>OpenAPI</td><td>OpenAPI / Swagger — chuẩn mô tả REST API dạng máy đọc được, dùng để sinh tài liệu và code.</td><td>Ch.3</td></tr><tr><td>OpenFeign</td><td>Thư viện Spring cho phép gọi REST service khác qua khai báo interface (declarative HTTP client).</td><td>Ch.4</td></tr><tr><td>Orchestration</td><td>Cách phối hợp saga có “nhạc trưởng” trung tâm điều khiển từng bước.</td><td>Ch.6</td></tr><tr><td>Outbox Pattern</td><td>Ghi sự kiện vào một bảng “outbox” cùng transaction với dữ liệu nghiệp vụ, rồi publish riêng — tránh mất/đôi sự kiện do dual-write.</td><td>Ch.10</td></tr><tr><td>Overhead</td><td>Chi phí tài nguyên/độ trễ phát sinh thêm ngoài công việc chính.</td><td>Ch.1</td></tr><tr><td>Pact</td><td>Công cụ contract testing theo hướng consumer-driven.</td><td>Ch.3</td></tr><tr><td>Pipeline</td><td>Chuỗi bước tự động (build, test, deploy…) nối tiếp nhau.</td><td>Ch.12</td></tr><tr><td>PKCE</td><td>Proof Key for Code Exchange — cơ chế bảo vệ luồng OAuth2 Authorization Code cho client công khai (mobile/SPA) chống đánh cắp mã.</td><td>Ch.9</td></tr><tr><td>Poison Pill</td><td>Message lỗi/không xử lý được làm consumer kẹt vòng lặp retry; cần tách sang DLT.</td><td>Ch.5</td></tr><tr><td>Polyglot Persistence</td><td>Mỗi service tự chọn loại database phù hợp nhất với nhu cầu của nó (SQL, NoSQL, cache…).</td><td>Ch.7</td></tr><tr><td>RBAC</td><td>Role-Based Access Control — phân quyền theo vai trò được gán cho người dùng.</td><td>Ch.9</td></tr><tr><td>Rate Limiting</td><td>Giới hạn số request trong một khoảng thời gian để bảo vệ hệ thống khỏi quá tải/lạm dụng.</td><td>Ch.8</td></tr><tr><td>Refactor</td><td>Cải thiện cấu trúc mã mà không thay đổi hành vi.</td><td>Ch.1</td></tr><tr><td>REST</td><td>Kiểu kiến trúc API dựa trên resource và HTTP verbs (GET/POST/PUT/DELETE).</td><td>Ch.3</td></tr><tr><td>Resilience4j</td><td>Thư viện Java hiện thực các resilience pattern (Circuit Breaker, Retry, Timeout, Bulkhead) qua annotation/config.</td><td>Ch.4</td></tr><tr><td>Retry</td><td>Thử lại request khi gặp lỗi tạm thời.</td><td>Ch.4</td></tr><tr><td>Routing</td><td>Quá trình định tuyến, điều hướng request từ nguồn đến đúng đích dựa trên các quy tắc (path, header).</td><td>Ch.8</td></tr><tr><td>Saga pattern</td><td>Quản lý transaction phân tán bằng chuỗi local transaction, mỗi bước có hành động bù trừ khi cần rollback.</td><td>Ch.6</td></tr><tr><td>Scaling</td><td>Mở rộng khả năng phục vụ bằng cách thêm tài nguyên (scale up) hoặc thêm instance (scale out).</td><td>Ch.1</td></tr><tr><td>Service</td><td>Một thành phần phần mềm tự chủ cung cấp một nhóm chức năng qua giao diện rõ ràng.</td><td>Ch.1</td></tr><tr><td>Service Discovery</td><td>Cơ chế để service tìm địa chỉ động của service khác mà không hard-code IP.</td><td>Ch.4</td></tr><tr><td>Service Mesh</td><td>Lớp hạ tầng (thường qua sidecar) lo giao tiếp service-to-service: routing, mTLS, retry, observability.</td><td>Ch.12</td></tr><tr><td>Sidecar</td><td>Sidecar pattern — đặt một container phụ chạy cạnh service chính để lo các việc chung (proxy, logging) mà không phải sửa đổi mã nguồn của dịch vụ.</td><td>Ch.12</td></tr><tr><td>SLI/SLO/SLA</td><td>Chỉ số đo chất lượng dịch vụ (SLI), mục tiêu nội bộ (SLO) và cam kết với khách hàng (SLA).</td><td>Ch.11</td></tr><tr><td>Strangler Fig</td><td>Strangler Fig pattern — thay thế dần hệ cũ bằng cách bọc và chuyển từng phần chức năng sang hệ mới, đến khi hệ thống cũ bị thay thế hoàn toàn.</td><td>Ch.10</td></tr><tr><td>Strong Consistency</td><td>Nhất quán mạnh — mọi read luôn thấy write mới nhất, không có khoảng tạm thời đọc phải dữ liệu cũ (stale).</td><td>Ch.7</td></tr><tr><td>Sysbox</td><td>Runtime container cho phép chạy Docker/Kubernetes lồng bên trong container an toàn hơn.</td><td>Ch.12</td></tr><tr><td>Team</td><td>Nhóm/đội phát triển.</td><td>Ch.1</td></tr><tr><td>Timeout</td><td>Hủy request khi vượt quá thời gian chờ cho phép.</td><td>Ch.4</td></tr><tr><td>Traffic</td><td>Lưu lượng truy cập mạng hoặc khối lượng dữ liệu trao đổi giữa các thành phần hệ thống.</td><td>Ch.8</td></tr><tr><td>Turnstile</td><td>Cloudflare Turnstile — dịch vụ challenge chống bot (thay thế CAPTCHA), bảo vệ các form nhạy cảm như đăng nhập/đăng ký/khôi phục mật khẩu.</td><td>Ch.9</td></tr><tr><td>Two-Phase Commit</td><td>2PC — giao thức commit phân tán hai pha (prepare rồi commit); đảm bảo nhất quán nhưng khóa tài nguyên và kém chịu lỗi, ít dùng trong microservices.</td><td>Ch.6</td></tr><tr><td>WebSocket / SSE</td><td>Hai cơ chế server đẩy dữ liệu real-time về client: WebSocket (hai chiều, full-duplex) và Server-Sent Events (một chiều server→client).</td><td>Ch.5</td></tr></tbody></table></figure><div><p><strong><img loading="lazy" decoding="async" src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjOWNhM2FmIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2Ij48cGF0aCBkPSJNMCA4YTggOCAwIDEgMSAxNiAwQTggOCAwIDAgMSAwIDhabTgtNi41YTYuNSA2LjUgMCAxIDAgMCAxMyA2LjUgNi41IDAgMCAwIDAtMTNaTTYuNSA3Ljc1QS43NS43NSAwIDAgMSA3LjI1IDdoMWEuNzUuNzUgMCAwIDEgLjc1Ljc1djIuNzVoLjI1YS43NS43NSAwIDAgMSAwIDEuNWgtMmEuNzUuNzUgMCAwIDEgMC0xLjVoLjI1di0yaC0uMjVhLjc1Ljc1IDAgMCAxLS43NS0uNzVaTTggNmExIDEgMCAxIDEgMC0yIDEgMSAwIDAgMSAwIDJaIj48L3BhdGg+PC9zdmc+" width="16" height="16" style="display: block; width: 1.2em"><p>Lưu ý</p></strong></p><p><strong>Lưu ý:</strong> Lần đầu xuất hiện trong text, thuật ngữ được in nghiêng kèm giải thích tiếng Việt. Sau đó dùng thuật ngữ tiếng Anh trực tiếp.</p></div>
