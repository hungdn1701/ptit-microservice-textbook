name: Artifact Consistency Gate

on:
  pull_request:
    branches: ["master", "main"]
  push:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify metadata consistency
        run: npm run check:metadata

      - name: Refresh diagram manifest
        if: ${{ hashFiles('references/internal/scripts/update-diagram-manifest.ps1') != '' }}
        shell: pwsh
        run: |
          .\references\internal\scripts\update-diagram-manifest.ps1

      - name: Verify manifest is committed
        if: ${{ hashFiles('references/internal/scripts/update-diagram-manifest.ps1') != '' }}
        run: |
          git diff --quiet --exit-code -- web/figures/diagram-manifest.json web/figures/diagram-manifest.js \
            || (echo "diagram-manifest is stale — run update-diagram-manifest.ps1 locally and commit." && exit 1)

      - name: Verify all diagram HTMLs have committed PNGs
        run: |
          missing=0
          while IFS= read -r html; do
            png="${html%.html}.png"
            if [ ! -f "$png" ]; then
              echo "Missing PNG: $png  (source: $html)"
              missing=$((missing + 1))
            fi
          done < <(find web/figures -name "fig-*.html" 2>/dev/null)
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "Error: $missing diagram(s) missing PNG. Run gen-diagrams.ps1 locally and commit the PNGs."
            exit 1
          fi
          echo "All diagram PNGs present."

      - name: Run editorial audit (when internal submodule is available)
        if: ${{ hashFiles('references/internal/scripts/audit-editorial.ps1') != '' }}
        shell: pwsh
        run: |
          .\references\internal\scripts\audit-editorial.ps1
